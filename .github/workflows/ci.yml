name: CI

on:
  push:
    branches:
      - main
      - ops-*
  pull_request:

jobs:
  test:
    name: shell, schema, e2e
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: scripts/test.sh

  release-check:
    name: release safety
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release check
        run: bin/aiops release-check --strict --allow-pending-release

  project-ci-template:
    name: project ci template
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project CI
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          bin/aiops seed --target "$tmpdir" --adapter both --mode link --core "$PWD"
          cp -R templates/ai_project/fast_track "$tmpdir/.ai_project"
          perl -0pi -e 's/\{\{START_CONTEXT\}\}/ops_setup_only/g; s/\{\{READINESS_LEVEL\}\}/ops_only/g' "$tmpdir/.ai_project/operating_model.md"
          mkdir -p \
            "$tmpdir/.ai_project/tasks/active" \
            "$tmpdir/.ai_project/tasks/backlog" \
            "$tmpdir/.ai_project/tasks/archive" \
            "$tmpdir/.ai_project/handoffs"
          bin/aiops knowledge init --target "$tmpdir" --mode minimal
          bin/aiops ci init --target "$tmpdir"

          test -f "$tmpdir/.github/workflows/aiops.yml"
          bin/aiops doctor --target "$tmpdir" --strict
          bin/aiops validate --target "$tmpdir" --strict
          bin/aiops migrate --target "$tmpdir" --plan
          bin/aiops knowledge lint --target "$tmpdir"

  dashboard-visual:
    name: dashboard browser visual
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dashboard visual regression
        env:
          AIOPS_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/dashboard-visual
        run: tests/visual_dashboard.sh

      - name: Upload dashboard visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual
          path: ${{ runner.temp }}/dashboard-visual
          if-no-files-found: warn
          retention-days: 14
